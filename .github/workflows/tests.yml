name: Pruebas y despliegue
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate_proto.py
      - run: git diff --exit-code -- shortener/generated
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T shortener-v1 python scripts/smoke.py --v1 https://shortener-v1:8443 --v2 https://shortener-v2:8444 --cert certs/server.crt
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
